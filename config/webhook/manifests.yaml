---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-managedupgrade-appuio-io-v1beta1-upgradejobhook
  failurePolicy: Fail
  name: validate-managedupgrade-v1beta1-upgradejobhook.appuio.io
  rules:
  - apiGroups:
    - managedupgrade.appuio.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - upgradejobhooks
  sideEffects: None
